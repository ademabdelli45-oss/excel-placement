<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel Language Center · Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#011D30;--navy2:#0A2E48;--teal:#4CB7A5;--teal-d:#23887A;--teal-l:#DDF3EF;
  --coral:#FF6B5B;--sun:#FFC94A;--sky:#54B6F2;--violet:#8B6CF6;--leaf:#3DBE7A;
  --paper:#F6F9FB;--ink:#0E2233;--muted:#586A78;--line:#DCE5EB;--white:#fff;
  --r:22px;--shadow:0 2px 4px rgba(1,29,48,.05),0 18px 40px rgba(1,29,48,.09);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:18px/1.55 Calibri,Carlito,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.08;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding:18px 22px;max-width:1120px;margin:0 auto}
.bar img{height:38px}
.bar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
/* buttons */
.btn{border:0;border-radius:16px;padding:14px 24px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--navy);color:#fff;transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(1,29,48,.18)}
.btn:active{transform:translateY(1px)}
.btn.teal{background:var(--teal);color:var(--navy)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn.sm{padding:9px 16px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:22px;height:22px}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;padding:26px 0 40px}
.hero h1{font-size:clamp(44px,6.4vw,80px);font-weight:700;color:var(--navy)}
.hero h1 .ln{display:block}
.hero .lead{font-size:21px;color:var(--muted);max-width:30ch;margin:18px 0 28px}
.art{position:relative;aspect-ratio:1/1;max-width:500px;justify-self:center;width:100%}
.art .blob{position:absolute;inset:6% 4% 8% 6%;background:var(--teal);border-radius:46% 54% 42% 58%/52% 44% 56% 48%}
.art .photo{position:absolute;inset:10% 9% 12% 11%;border-radius:40% 60% 44% 56%/56% 42% 58% 44%;overflow:hidden;background-size:cover;background-position:center}
.art svg.sketch{position:absolute;inset:0;width:100%;height:100%}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px}
.choice{position:relative;text-align:left;border:0;border-radius:var(--r);padding:22px 22px 20px;color:#fff;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow);transition:transform .15s}
.choice:hover{transform:translateY(-3px) rotate(-.4deg)}
.choice.adult{background:var(--navy)}
.choice.kids{background:var(--coral)}
.choice b{font-size:27px;line-height:1.05;position:relative}
.choice span{position:relative;font-size:16px;opacity:.9;margin-top:4px}
.choice .doodle{position:absolute;right:-10px;top:-10px;width:120px;height:120px;opacity:.95}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 60px}
.strip div{background:#fff;border-radius:18px;padding:18px;border:1.5px solid var(--line)}
.strip b{display:block;font-size:19px;margin-bottom:2px}
.strip span{color:var(--muted);font-size:16px}
.strip i{display:block;width:40px;height:6px;border-radius:9px;margin-bottom:12px}
/* cards & forms */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:30px}
.narrow{max-width:760px;margin:10px auto 60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label.f{display:block;font-weight:700;font-size:16px;margin:0 0 6px;color:var(--navy)}
.input{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:18px}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 25%,transparent)}
textarea.input{min-height:260px;resize:vertical;line-height:1.6}
.hint{color:var(--muted);font-size:16px}
.err{background:#FFE8E4;color:#9A2A1B;border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--teal)}
.head h2{font-size:clamp(30px,4vw,44px);color:var(--navy)}
.head p{color:var(--muted);margin:8px 0 0}
.list{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.list li{display:flex;gap:14px;align-items:flex-start}
.list li i{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
/* test runner */
.runner{max-width:900px;margin:0 auto;padding:0 18px 140px}
.tbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tbar .in{max-width:900px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.tbar img{height:30px}
.steps{display:flex;gap:6px;flex:1;min-width:0}
.steps span{flex:1;height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.steps span.done{background:var(--teal)}
.steps span.now{background:color-mix(in srgb,var(--teal) 35%,var(--line))}
.timer{font-weight:700;font-variant-numeric:tabular-nums;background:var(--navy);color:#fff;border-radius:12px;padding:6px 12px;font-size:17px;min-width:82px;text-align:center}
.timer.low{background:var(--coral)}
.sechead{display:flex;align-items:center;gap:18px;margin:26px 0 18px}
.sechead .badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;flex:none}
.sechead h2{font-size:clamp(28px,4vw,38px);color:var(--navy)}
.sechead p{margin:4px 0 0;color:var(--muted)}
.q{background:#fff;border-radius:18px;padding:20px 22px;margin-bottom:14px;border:1.5px solid var(--line)}
.q .n{font-weight:700;color:var(--teal-d);font-size:15px}
.q .stem{font-size:20px;margin:2px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;text-align:left;font-size:18px;display:flex;gap:10px;align-items:center;transition:border-color .1s,background .1s}
.opt:hover{border-color:var(--teal)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--paper);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.opt[aria-pressed="true"] .k{background:var(--teal);color:var(--navy)}
.opts.long{grid-template-columns:1fr}
.passage{background:#fff;border-radius:18px;padding:24px 26px;border-left:8px solid var(--sky);margin-bottom:18px;box-shadow:var(--shadow)}
.passage h3{font-size:24px;color:var(--navy);margin-bottom:10px}
.passage p{margin:0 0 12px;line-height:1.7}
.player{display:flex;align-items:center;gap:16px;background:var(--navy);color:#fff;border-radius:20px;padding:18px 20px;margin-bottom:18px}
.player .play{width:64px;height:64px;border-radius:50%;border:0;background:var(--teal);color:var(--navy);display:grid;place-items:center;flex:none}
.player .play svg{width:28px;height:28px}
.wave{display:flex;gap:4px;align-items:center;height:34px}
.wave i{width:5px;border-radius:4px;background:var(--teal);height:8px}
.playing .wave i{animation:w .9s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes w{50%{height:32px}}
.navrow{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.navrow .in{max-width:900px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.save{font-size:15px;color:var(--muted)}
.wc{font-weight:700;font-size:16px}
.wc.ok{color:var(--leaf)}.wc.bad{color:var(--coral)}
/* speaking */
.mic{display:grid;place-items:center;gap:16px;padding:28px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);text-align:center}
.ring{position:relative;width:190px;height:190px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .core{position:absolute;inset:22px;border-radius:50%;background:var(--coral);display:grid;place-items:center;color:#fff;border:0;transition:transform .15s}
.ring .core.idle{background:var(--navy)}
.ring .core svg{position:static;transform:none;width:54px;height:54px}
.ring .t{position:absolute;left:0;right:0;bottom:-34px;font-weight:700;font-variant-numeric:tabular-nums}
.rec .ring .core{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 0 14px color-mix(in srgb,var(--coral) 20%,transparent)}}
.prompt{background:var(--navy);color:#fff;border-radius:var(--r);padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden}
.prompt h3{font-size:clamp(24px,3.2vw,32px);line-height:1.2}
.prompt ul{margin:12px 0 0;padding-left:22px;color:#CFE6EF}
.prompt .say{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.prompt .say svg{width:18px;height:18px}
.meter{height:12px;border-radius:9px;background:var(--line);overflow:hidden;width:min(320px,90%)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun),var(--coral));transition:width .08s}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.tag.ok{background:color-mix(in srgb,var(--leaf) 18%,transparent);color:#1E7A4B}
.tag.warn{background:color-mix(in srgb,var(--sun) 35%,transparent);color:#7A5300}
.done-list{display:grid;gap:8px;margin-top:10px}
/* kids mode */
body.kids{--paper:#FFF8EC;background:var(--paper)}
body.kids .q{border-width:3px;border-radius:24px}
body.kids .opt{font-size:22px;border-width:3px;border-radius:20px}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pics.three{grid-template-columns:repeat(3,1fr)}
.pic{aspect-ratio:1/1;border:3px solid var(--line);border-radius:24px;background:#fff;font-size:clamp(44px,9vw,72px);display:grid;place-items:center;transition:transform .12s}
.pic:hover{transform:scale(1.04);border-color:var(--sun)}
.pic[aria-pressed="true"]{border-color:var(--coral);background:#FFF0EC;box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}
.pic.txt{font-size:34px;font-weight:700;color:var(--navy)}
.scene{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:linear-gradient(#8ED3F7 0 55%,#7FD18D 55% 100%);margin-bottom:16px;box-shadow:var(--shadow)}
.scene span{position:absolute;font-size:clamp(30px,6vw,56px);line-height:1}
.thanks{text-align:center;padding:40px 10px}
.thanks h2{font-size:clamp(40px,6vw,64px);color:var(--navy)}
.center{text-align:center}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:60;transition:.2s;max-width:calc(100% - 24px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:6px}
  .art{max-width:340px;order:-1}
  .strip{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .card{padding:22px}
  .pics{grid-template-columns:repeat(2,1fr)}
  .choices{grid-template-columns:1fr 1fr}
  .choice{min-height:140px;padding:18px}
  .choice b{font-size:22px}
  body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function call(action,data){
  const body=JSON.stringify(Object.assign({action},data||{}));
  const once=()=>HAS_GAS?new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>{const o=JSON.parse(r);o.ok?res(o):rej(new Error(o.error));}).withFailureHandler(rej).placementApi(body))
    :fetch(API_URL,{method:'POST',body}).then(r=>r.json()).then(o=>{if(!o.ok)throw new Error(o.error);return o;});
  let n=0;const go=()=>once().catch(e=>{const m=String(e&&e.message||e);if(/CODE|NAME|SESSION|submitted|too large/.test(m)||++n>=3)throw e;return new Promise(r=>setTimeout(r,800*n)).then(go);});
  return go();
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ test runner ============ */
const secs=()=>S.test.sections;
const cur=()=>secs()[S.sec];
const COLORS={A:'var(--teal)',B:'var(--sky)',C:'var(--violet)',D:'var(--sun)',S:'var(--coral)',V:'var(--teal)',G:'var(--sky)',R:'var(--violet)',L:'var(--sun)',W:'var(--leaf)'};
let tick=null;
function vTest(){
  const s=cur(),a=S.ans[s.id]=S.ans[s.id]||{};
  if(!S.secStart[s.id]){S.secStart[s.id]=Date.now();persist();}
  const head='<div class="tbar"><div class="in"><img src="'+LOGO+'" alt="Excel"><div class="steps" aria-label="Progress">'+secs().map((x,i)=>'<span class="'+(i<S.sec?'done':i===S.sec?'now':'')+'" title="'+esc(x.title)+'"></span>').join('')+'</div>'+(s.minutes?'<span class="timer" id="timer">--:--</span>':'')+'</div></div>';
  let body='<div class="sechead"><div class="badge" style="background:'+(COLORS[s.id]||'var(--teal)')+'">'+(S.kind==='kids'?(S.sec+1):s.id)+'</div><div><h2>'+esc(s.title)+'</h2><p>'+esc(s.intro||'')+(s.minutes?' You have '+s.minutes+' minutes.':'')+'</p></div></div>';
  if(s.type==='mcq')body+=s.items.map((it,i)=>qMcq(s,it,i,a)).join('');
  if(s.type==='pics')body+=s.items.map((it,i)=>qPics(s,it,i,a)).join('');
  if(s.type==='reading')body+=passage(s.passage)+s.items.map((it,i)=>it.open?qOpen(s,it,i,a):qMcq(s,it,i,a,true)).join('');
  if(s.type==='listening')body+=player('C',s.plays)+s.items.map((it,i)=>qShort(s,it,i,a)).join('');
  if(s.type==='kidlisten')body+=s.items.map((it,i)=>qKidListen(s,it,i,a)).join('');
  if(s.type==='writing')body+='<div class="prompt"><h3>'+esc(s.prompt.text)+'</h3></div><textarea class="input" id="wtext" data-w="'+s.id+'" placeholder="Start writing here…" spellcheck="false" autocorrect="off" autocapitalize="sentences">'+esc(a.text||'')+'</textarea><p class="wc" id="wc"></p>';
  if(s.type==='speaking'){app.innerHTML=head+'<div class="runner" id="run">'+body+'<div id="spk"></div></div>';drawSpeaking();return;}
  const last=S.sec===secs().length-1;
  app.innerHTML=head+'<div class="runner" id="run">'+body+'</div><div class="navrow"><div class="in"><span class="save" id="savest">Answers save automatically</span><button class="btn teal" data-act="next">'+(last?'Finish':'Next section')+' '+I.arrow+'</button></div></div>';
  if(s.type==='writing')wordCount();
  startTimer();
}
const letters='ABCD';
function qMcq(s,it,i,a,long){const n=i+1,opts=shuffled(it.o,S.seed+n*31+s.id.charCodeAt(0));return '<div class="q"><div class="n">Question '+n+'</div><div class="stem">'+esc(it.q).replace('___','<b>_____</b>')+'</div><div class="opts'+(long||opts.some(o=>o.length>22)?' long':'')+'">'+opts.map((o,j)=>'<button class="opt" data-sec="'+s.id+'" data-n="'+n+'" data-v="'+esc(o)+'" aria-pressed="'+(a[n]===o)+'"><span class="k">'+letters[j]+'</span>'+esc(o)+'</button>').join('')+'</div></div>';}
function qPics(s,it,i,a){const n=i+1,opts=shuffled(it.o,S.seed+n*17);return '<div class="q"><div class="stem" style="font-size:24px"><b>'+n+'.</b> '+esc(it.q)+'</div><div class="pics">'+opts.map(o=>'<button class="pic" data-sec="'+s.id+'" data-n="'+n+'" data-v="'+esc(o)+'" aria-pressed="'+(a[n]===o)+'" aria-label="Picture option">'+esc(o)+'</button>').join('')+'</div></div>';}
function qOpen(s,it,i,a){const n=i+1;return '<div class="q"><div class="n">Question '+n+'</div><div class="stem">'+esc(it.q)+'</div><textarea class="input" style="min-height:90px" data-open="'+s.id+'" data-n="'+n+'" maxlength="300" placeholder="Write your answer">'+esc(a[n]||'')+'</textarea></div>';}
function qShort(s,it,i,a){const n=i+1;return '<div class="q"><div class="n">Question '+n+'</div><div class="stem">'+esc(it.q)+'</div><input class="input" data-open="'+s.id+'" data-n="'+n+'" maxlength="120" value="'+esc(a[n]||'')+'" placeholder="Short answer" autocomplete="off"></div>';}
function qKidListen(s,it,i,a){const n=i+1,key='L'+n,left=Math.max(0,(s.plays||2)-(S.plays[key]||0));
  return '<div class="q"><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><button class="btn coral" data-act="kidplay" data-n="'+n+'"'+(left?'':' disabled')+' style="border-radius:50%;width:64px;height:64px;padding:0" aria-label="Play">'+I.play+'</button><div><div class="stem" style="margin:0;font-size:24px"><b>'+n+'.</b> '+esc(it.q)+'</div><div class="hint">'+(left?'You can listen '+left+' more time'+(left===1?'':'s')+'.':'No more listens.')+'</div></div></div>'+
   '<div class="pics three">'+it.o.map(o=>'<button class="pic'+(/^\d+$/.test(o)?' txt':'')+'" data-sec="'+s.id+'" data-n="'+n+'" data-v="'+esc(o)+'" aria-pressed="'+(a[n]===o)+'">'+esc(o)+'</button>').join('')+'</div></div>';}
function passage(p){return '<article class="passage"><h3>'+esc(p.title)+'</h3>'+p.paras.map(x=>'<p>'+esc(x)+'</p>').join('')+'</article>';}
function player(key,plays){const left=Math.max(0,plays-(S.plays[key]||0));return '<div class="player" id="player"><button class="play" data-act="play" aria-label="Play the recording"'+(left?'':' disabled style="opacity:.4"')+'>'+I.play+'</button><div style="flex:1"><b>Telephone conversation</b><div style="color:#B9D6E2;font-size:16px" id="plays">'+(left?'You can play it '+left+' more time'+(left===1?'':'s')+'.':'You have listened twice.')+'</div></div><div class="wave">'+'<i></i>'.repeat(9)+'</div></div>';}
function wordCount(){const t=$('#wtext');if(!t)return;const s=cur(),n=t.value.trim()?t.value.trim().split(/\s+/).length:0;const el=$('#wc');el.textContent=n+' words (aim for '+s.min+' to '+s.max+')';el.className='wc '+(n>=s.min&&n<=s.max?'ok':n>s.max?'bad':'');}

/* timers */
function startTimer(){clearInterval(tick);const s=cur();if(!s.minutes)return;const end=S.secStart[s.id]+s.minutes*60000;
  const upd=()=>{const left=Math.max(0,end-Date.now()),el=$('#timer');if(!el){clearInterval(tick);return;}const m=Math.floor(left/60000),sec=Math.floor(left%60000/1000);el.textContent=m+':'+String(sec).padStart(2,'0');el.classList.toggle('low',left<60000);
    if(left<=0){clearInterval(tick);toast('Time is up for '+s.title+'. Moving on.');nextSection(true);}};upd();tick=setInterval(upd,500);}

/* saving */
let saveT=null;
function queueSave(){clearTimeout(saveT);persist();saveT=setTimeout(()=>saveSection(cur().id),2500);const st=$('#savest');if(st)st.textContent='Saving…';}
function saveSection(id){const a=Object.assign({},S.ans[id]||{});return call('save',{id:S.id,key:S.key,section:id,answers:a}).then(()=>{const st=$('#savest');if(st)st.textContent='All answers saved';}).catch(()=>{const st=$('#savest');if(st)st.textContent='Saved on this device. Will retry.';});}
let moving=false;
async function nextSection(auto){
  if(moving)return;const s=cur();
  if(!auto&&s.type!=='speaking'){const need=(s.items||[]).length,got=Object.keys(S.ans[s.id]||{}).filter(k=>String(S.ans[s.id][k]).trim()).length;
    if(s.type==='writing'){const w=(S.ans[s.id].text||'').trim();if(!w&&!confirm('You haven’t written anything. Go on anyway?'))return;}
    else if(need&&got<need&&!confirm((need-got)+' question'+(need-got===1?' is':'s are')+' not answered. You can’t come back to this section. Go on anyway?'))return;}
  moving=true;clearTimeout(saveT);clearInterval(tick);
  await saveSection(s.id);
  moving=false;
  if(S.sec<secs().length-1){S.sec++;persist();render();}else finish();
}
async function finish(){
  app.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;background:rgba(246,249,251,.9);display:grid;place-items:center;z-index:70"><div class="card center"><h2 style="color:var(--navy)">Sending your test…</h2><p class="hint">Please keep this page open.</p></div></div>');
  try{for(const x of secs())if(x.type!=='speaking'&&S.ans[x.id])await saveSection(x.id);await call('submit',{id:S.id,key:S.key});clearSaved();try{if(media)media.getTracks().forEach(x=>x.stop());speechSynthesis.cancel();}catch(_){}S.screen='thanks';render();}
  catch(e){toast('Couldn’t send. Check your internet and press Finish again.');const o=app.lastElementChild;if(o)o.remove();}
}

/* ============ listening (text to speech) ============ */
let voices=[];function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(g){const f=/female|samantha|victoria|karen|tessa|moira|fiona|zira|hazel|susan|serena|google uk english female|google us english/i,m=/male|daniel|alex|fred|oliver|george|david|mark|james|google uk english male|arthur|rishi/i;
  return voices.find(v=>(g==='W'?f:m).test(v.name)&&!(g==='W'&&/\bmale\b/i.test(v.name)&&!/female/i.test(v.name)))||voices.find(v=>/en-GB|en-US/i.test(v.lang))||voices[0]||null;}
function speak(lines,onDone){if(!('speechSynthesis' in window)){toast('This browser can’t play audio. Ask a staff member.');return;}speechSynthesis.cancel();let i=0;
  const next=()=>{if(i>=lines.length){onDone&&onDone();return;}const[g,t]=lines[i++];const u=new SpeechSynthesisUtterance(t);const v=pickVoice(g);if(v)u.voice=v;u.lang='en-GB';u.rate=.95;u.pitch=g==='M'?.85:1.1;u.onend=()=>setTimeout(next,350);u.onerror=()=>setTimeout(next,350);speechSynthesis.speak(u);};next();}

/* ============ speaking ============ */
function spItems(){const s=cur();if(s.kidsPrompts)return s.kidsPrompts.map((p,i)=>({part:'K'+(i+1),q:p.q,sec:p.sec,scene:p.scene}));
  const L=s.warmup.map((w,i)=>({part:'W'+(i+1),q:w.q,sec:w.sec,title:'Warm-up'}));
  L.push({part:'T1',q:s.prompt.text,points:s.prompt.points,sec:s.talk,prep:s.prep,title:'Long turn'});
  (S.probes||[]).forEach((p,i)=>L.push({part:'F'+(i+1),q:p,sec:s.probeSec,title:'Follow-up'}));return L;}
let media=null,rec=null,chunks=[],recTimer=null,recStart=0,blobs={},prepTimer=null,audioCtx=null,analyser=null;
async function getMic(){if(media&&media.active)return media;media=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});return media;}
function pickMime(){const c=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4','audio/webm'];for(const m of c)if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return '';}
async function drawSpeaking(){
  const s=cur(),box=$('#spk');
  if(!s.kidsPrompts&&S.probes==null){box.innerHTML='<div class="mic"><p>Getting your questions ready…</p></div>';try{const r=await call('probes',{id:S.id,key:S.key});S.probes=r.probes||[];persist();}catch(e){S.probes=[];}}
  const items=spItems();const done=items.filter(x=>S.rec[x.part]).length;
  if(S.spIdx>=items.length){box.innerHTML='<div class="mic"><h2 style="color:var(--navy)">'+(S.kind==='kids'?'Great talking!':'Speaking complete')+'</h2><p class="hint">All '+items.length+' recordings are saved.</p><button class="btn teal" data-act="finishtest">Finish the test '+I.arrow+'</button></div>';return;}
  const it=items[S.spIdx],has=!!S.rec[it.part]&&S.retake!==it.part,local=has?blobs[it.part]:'';
  box.innerHTML='<p class="hint" style="margin:0 0 10px"><b>'+(it.title?esc(it.title)+', ':'')+'recording '+(S.spIdx+1)+' of '+items.length+'</b>. You can record each answer twice. The second try replaces the first.</p>'+
   (it.scene?kidScene():'')+
   '<div class="prompt"><button class="say" data-act="sayq">'+I.speaker+'Listen</button><h3>'+esc(it.q)+'</h3>'+(it.points?'<p style="margin:12px 0 0;color:#CFE6EF">You should say:</p><ul>'+it.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':'')+'</div>'+
   '<div class="mic" id="micbox"><div class="ring"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="88" stroke="#DCE5EB" stroke-width="10" fill="none"/><circle id="arc" cx="95" cy="95" r="88" stroke="var(--coral)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553"/></svg><button class="core idle" data-act="rec" aria-label="Start recording">'+I.mic+'</button><div class="t" id="rt">Up to '+fmtSec(it.sec)+'</div></div>'+
   '<div style="height:18px"></div><div class="meter"><i id="lvl"></i></div>'+
   (it.prep&&!has?'<div id="prep"><p class="hint" style="margin:0">You have '+it.prep+' seconds to think first. You can make notes on paper.</p><button class="btn ghost sm" data-act="prep" style="margin-top:8px">Start thinking time</button></div>':'')+
   (has?'<div class="tag ok">'+I.check.replace('<svg','<svg style="width:18px;height:18px"')+'Saved ('+fmtSec(S.rec[it.part].sec)+')</div>':'')+
   (local?'<audio controls src="'+local+'" style="width:min(360px,100%)"></audio>':'')+
   '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+(has?(S.rec[it.part].tries<2?'<button class="btn ghost sm" data-act="retake">'+I.redo+'Record again</button>':'')+'<button class="btn teal" data-act="spnext">Next '+I.arrow+'</button>':(S.retake===it.part?'<button class="btn ghost sm" data-act="keep">Keep my first recording</button>':''))+'</div><div id="uperr"></div></div>'+
   '<p class="hint center" style="margin-top:14px">'+done+' of '+items.length+' saved</p>';
}
function kidScene(){const e=[['☀️',6,6],['🌳',4,40],['🌳',84,34],['🏠',70,18],['⚽',30,72],['🧒',22,58],['👧',44,56],['🐕',58,70],['🚲',74,64],['🍦',12,74],['🐦',40,14],['🎈',88,10],['🦆',86,78]];
  return '<div class="scene" aria-label="Picture of a park">'+e.map(x=>'<span style="left:'+x[1]+'%;top:'+x[2]+'%">'+x[0]+'</span>').join('')+'</div>';}
const fmtSec=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function meter(stream){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=512;src.connect(analyser);const data=new Uint8Array(analyser.fftSize);
  const loop=()=>{if(!analyser)return;analyser.getByteTimeDomainData(data);let m=0;for(const v of data)m=Math.max(m,Math.abs(v-128));const el=$('#lvl');if(el)el.style.width=Math.min(100,m*1.6)+'%';requestAnimationFrame(loop);};loop();}catch(e){}}
async function startRec(){
  const items=spItems(),it=items[S.spIdx];clearInterval(prepTimer);
  try{await getMic();}catch(e){$('#uperr').innerHTML='<div class="err">We can’t use your microphone. Allow microphone access in your browser, or open this link in Chrome or Safari.</div>';return;}
  const mime=pickMime();chunks=[];
  try{rec=new MediaRecorder(media,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});}catch(e){rec=new MediaRecorder(media);}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>upload(it,new Blob(chunks,{type:(rec.mimeType||mime||'audio/webm')}),(Date.now()-recStart)/1000);
  rec.start(1000);recStart=Date.now();meter(media);
  const core=$('.ring .core');core.classList.remove('idle');core.innerHTML=I.stop;core.dataset.act='stop';core.setAttribute('aria-label','Stop recording');$('#micbox').classList.add('rec');
  const arc=$('#arc');recTimer=setInterval(()=>{const el=(Date.now()-recStart)/1000;if(arc)arc.style.strokeDashoffset=553-553*Math.min(1,el/it.sec);const t=$('#rt');if(t)t.textContent=fmtSec(el)+' / '+fmtSec(it.sec);if(el>=it.sec)stopRec();},200);
}
function stopRec(){clearInterval(recTimer);if(rec&&rec.state!=='inactive')rec.stop();analyser=null;const b=$('#micbox');if(b){b.classList.remove('rec');b.innerHTML='<p><b>Saving your recording…</b></p><div class="meter"><i style="width:60%;background:var(--teal)"></i></div>';}}
function upload(it,blob,sec){
  if(sec<1.5||blob.size<800){toast('That was too short. Try again.');drawSpeaking();return;}
  const url=URL.createObjectURL(blob);blobs[it.part]=url;
  const fr=new FileReader();fr.onload=()=>{const b64=String(fr.result).split(',')[1];
    call('audio',{id:S.id,key:S.key,part:it.part,mime:blob.type,b64,sec:Math.round(sec),q:it.q}).then(()=>{const prev=S.rec[it.part];S.rec[it.part]={sec:Math.round(sec),tries:(prev?prev.tries:0)+1};S.retake=null;persist();drawSpeaking();})
    .catch(e=>{drawSpeaking();$('#uperr').innerHTML='<div class="err">The recording didn’t upload. Check your internet and record again.</div>';});};
  fr.readAsDataURL(blob);
}

/* ============ events ============ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.kind){S.kind=d.kind;S.cand={};S.screen='details';if(!S.config){try{S.config=await call('config');}catch(err){S.config={codeRequired:false};}}render();return;}
  if(d.sec&&d.n){const a=S.ans[d.sec]=S.ans[d.sec]||{};a[d.n]=d.v;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));queueSave();return;}
  switch(d.act){
    case 'home':S.screen='home';render();return;
    case 'details':S.screen='details';render();return;
    case 'discard':if(confirm('Start a new test? Your unfinished test will be closed.')){clearSaved();render();}return;
    case 'resume':{const sv=loadSaved();b.disabled=true;try{const r=await call('resume',{id:sv.id,key:sv.key});if(r.status!=='in-progress'){clearSaved();toast('That test was already sent.');render();return;}
      Object.assign(S,{kind:sv.kind,id:sv.id,key:sv.key,test:r.test,seed:r.seed,cand:r.cand,sec:sv.sec||0,ans:Object.assign({},r.ans,sv.ans),rec:sv.rec||{},secStart:sv.secStart||{},plays:sv.plays||{},probes:r.probes,spIdx:sv.spIdx||0,screen:'test'});delete S.ans._at;render();}
      catch(err){toast('We couldn’t find that test. Please start again.');clearSaved();render();}return;}
    case 'sound':speak([['W','Hello! If you can hear this, your sound is working.']],()=>{const el=$('#sndok');if(el)el.innerHTML='<span class="tag ok">Sound works</span>';});return;
    case 'miccheck':try{const st=await getMic();meter(st);$('#micok').innerHTML='<span class="tag ok">Microphone connected. Speak and watch the bar.</span>';}catch(err){$('#micok').innerHTML='<div class="err">Microphone blocked. Tap the lock icon next to the address, allow the microphone, then try again. If it still doesn’t work, open this link in Chrome or Safari.</div>';}return;
    case 'begin':{b.disabled=true;$('#rerr').innerHTML='';try{if(!S.id){const r=await call('start',{kind:S.kind,cand:S.cand,code:S.cand._code||'',ua:navigator.userAgent});S.id=r.id;S.key=r.key;S.test=r.test;S.seed=r.seed;}
      S.sec=0;S.ans={};S.rec={};S.secStart={};S.plays={};S.spIdx=0;persist();S.screen='test';render();}
      catch(err){b.disabled=false;const m=String(err.message||err);$('#rerr').innerHTML='<div class="err">'+(m.indexOf('CODE')>=0?'The test code isn’t right. Ask the Excel office for it.':'We couldn’t start the test. Check your internet and try again.')+'</div>';}return;}
    case 'next':nextSection(false);return;
    case 'play':{const s=cur(),k='C';if((S.plays[k]||0)>=s.plays)return;S.plays[k]=(S.plays[k]||0)+1;persist();const p=$('#player');p.classList.add('playing');b.disabled=true;b.style.opacity='.4';
      speak(s.script,()=>{const pl=$('#player');if(!pl)return;pl.classList.remove('playing');const left=s.plays-S.plays[k],el=$('#plays');if(el)el.textContent=left?'You can play it '+left+' more time.':'You have listened twice.';if(left&&document.body.contains(b)){b.disabled=false;b.style.opacity='';}});return;}
    case 'kidplay':{const s=cur(),n=d.n,k='L'+n,it=s.items[n-1];if((S.plays[k]||0)>=s.plays)return;S.plays[k]=(S.plays[k]||0)+1;persist();speak([['W',it.say]],()=>{});const left=s.plays-S.plays[k],hn=b.nextElementSibling&&b.nextElementSibling.querySelector('.hint');if(hn)hn.textContent=left?'You can listen '+left+' more time.':'No more listens.';if(!left)b.disabled=true;return;}
    case 'sayq':{const it=spItems()[S.spIdx];speak([['W',it.q+(it.points?' You should say: '+it.points.join(', ')+'.':'')]]);return;}
    case 'prep':{const it=spItems()[S.spIdx];let left=it.prep;const box=$('#prep');const upd=()=>{box.innerHTML='<p style="margin:0;font-weight:700;font-size:22px">Thinking time: '+left+'s</p><button class="btn ghost sm" data-act="rec" style="margin-top:8px">I’m ready, start recording</button>';};upd();clearInterval(prepTimer);prepTimer=setInterval(()=>{left--;if(left<=0){clearInterval(prepTimer);startRec();}else upd();},1000);return;}
    case 'rec':startRec();return;
    case 'stop':stopRec();return;
    case 'retake':S.retake=spItems()[S.spIdx].part;drawSpeaking();return;
    case 'keep':S.retake=null;drawSpeaking();return;
    case 'spnext':S.spIdx++;persist();drawSpeaking();window.scrollTo(0,0);return;
    case 'finishtest':finish();return;
    case 'finishhome':S={screen:'home',kind:'',cand:{},test:null,id:'',key:'',seed:0,sec:0,ans:{},rec:{},secStart:{},plays:{},probes:null,spIdx:0,config:S.config};render();return;
  }
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='det')return;e.preventDefault();const fd=new FormData(e.target),g=n=>String(fd.get(n)||'').trim();
  if(!/^\d{1,3}$/.test(g('age'))){$('#derr').innerHTML='<div class="err">Please enter the age as a number.</div>';return;}
  S.cand={name:g('name'),age:g('age'),nationality:g('nationality'),parent:g('parent'),phone:g('phone'),email:g('email'),branch:g('branch'),agent:g('agent'),_code:g('code')};
  S.screen='ready';render();
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.open){const a=S.ans[t.dataset.open]=S.ans[t.dataset.open]||{};a[t.dataset.n]=t.value;queueSave();}
  if(t.dataset.w){const a=S.ans[t.dataset.w]=S.ans[t.dataset.w]||{};a.text=t.value;wordCount();queueSave();}
});
document.addEventListener('paste',e=>{if(e.target.dataset&&e.target.dataset.w){e.preventDefault();toast('Please type your own answer.');}});
window.addEventListener('beforeunload',e=>{if(S.screen==='test'){persist();e.preventDefault();e.returnValue='';}});

render();
})();
</script>
